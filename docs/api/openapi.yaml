      summary: Cria pergunta
      description: >
        Exige permissao pode_gerenciar_atividades. A identidade do autor vem de req.user.
        PROFESSOR pode criar pergunta para seu curso especifico ou com escopo global (todosCursos: true).
        Em ambos os casos, perguntas.id_curso recebe o curso de origem do professor e criado_por recebe seu ID.
        Quando todosCursos: true, o backend associa a pergunta internamente a todos os cursos ativos em perguntas_cursos.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerguntaRequest"
      responses:
        "201":
          description: Pergunta criada.
        "400":
          description: Dados invalidos.
        "401":
          description: Usuario autenticado nao encontrado ou token invalido.
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "500":
          $ref: "#/components/responses/ErroInternoMessage"
